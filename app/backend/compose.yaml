services:
  waraq:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      WARAQ_API_TOKEN: "${WARAQ_API_TOKEN:?Set WARAQ_API_TOKEN to a random token of at least 24 characters}"
      WARAQ_ALLOWED_ORIGINS: "${WARAQ_ALLOWED_ORIGINS:-}"
    read_only: true
    tmpfs:
      - /tmp:size=1073741824,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    restart: unless-stopped
